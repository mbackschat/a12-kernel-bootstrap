// Inside the kernel build, resolve the kernel's own coordinates to its projects.
// The metamodel jars come from Maven local and their POMs name kernel modules:
// since 2026.06-ext2 the runtime needs the DependencyModel typings, which need
// kernel-md-document-v2 and (via the runtime) kernel-md-serializer. Without this
// rule Gradle looks those up as external artifacts this build has not published.
allprojects { current ->
    current.configurations.configureEach {
        resolutionStrategy.dependencySubstitution { substitutions ->
            substitutions.all { substitution ->
                def requested = substitution.requested
                if (requested instanceof ModuleComponentSelector && requested.group == 'com.mgmtp.a12.kernel') {
                    def local = current.rootProject.allprojects.find { it.name == requested.module }
                    if (local != null) substitution.useTarget(substitutions.project(local.path))
                }
            }
        }
    }
}
